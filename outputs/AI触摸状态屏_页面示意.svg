<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img"><title>AI 触摸状态屏代表性页面与客户端配置体验</title><desc>四种设备页面及电脑编辑工作区。布局比例与数值为设计示意，不指定屏幕分辨率或技术方案。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253347}.title{font-size:28px;font-weight:600}.sub{font-size:16px;fill:#64748b}.label{font-size:18px}.value{font-size:34px;font-weight:600}.small{font-size:14px;fill:#64748b}.h{font-size:21px;font-weight:600}</style><rect width="1200" height="990" fill="#f6f8fb"/><text x="40" y="52" class="title">AI 触摸状态屏 · 代表性体验</text><text x="40" y="82" class="sub">内容层级示意，不是像素定稿；数值为演示数据，实际规格与数据来源待确认。</text><text x="40" y="122" class="h">01 AI 专注 · 看懂进展与介入时机</text><rect x="40" y="138" width="540" height="242" rx="18" fill="#ffffff" stroke="#d7dfeb"/><text x="60" y="168" class="label">AI 工作台</text><text x="438" y="168" class="small">连接正常</text><text x="66" y="206" class="small">当前任务：整理资料</text><text x="66" y="250" class="value">处理中</text><rect x="66" y="266" width="9" height="9" rx="4" fill="#277d9f"/><text x="87" y="276" class="label">检索阶段 · 02:18</text><text x="66" y="302" class="small">2 秒前更新 · 来源没有提供真实完成量</text><rect x="66" y="322" width="164" height="38" rx="8" fill="#edf5fa"/><text x="109" y="347" class="label">查看摘要</text><rect x="250" y="322" width="174" height="38" rx="8" fill="#edf5fa"/><text x="282" y="347" class="label">去电脑查看</text><text x="620" y="122" class="h">02 电脑总览 · 少量主指标</text><rect x="620" y="138" width="540" height="242" rx="18" fill="#ffffff" stroke="#d7dfeb"/><text x="641" y="168" class="label">电脑状态</text><rect x="640" y="184" width="240" height="76" rx="9" fill="#f2f5f9"/><text x="655" y="208" class="small">CPU 使用率</text><text x="655" y="245" class="value">36%</text><rect x="900" y="184" width="240" height="76" rx="9" fill="#f2f5f9"/><text x="915" y="208" class="small">内存 · 10.9 / 16 GB</text><text x="915" y="245" class="value">68%</text><rect x="640" y="270" width="240" height="76" rx="9" fill="#f2f5f9"/><text x="655" y="294" class="small">磁盘空间 · 可用 84 GB</text><text x="655" y="331" class="value">72%</text><rect x="900" y="270" width="240" height="76" rx="9" fill="#f2f5f9"/><text x="915" y="294" class="small">GPU</text><text x="915" y="328" class="h">未提供</text><text x="641" y="368" class="small">2 秒前更新 · 不可用指标不显示成 0</text><text x="40" y="422" class="h">03 环境 · 数值与数据年龄并重</text><rect x="40" y="438" width="540" height="222" rx="18" fill="#ffffff" stroke="#d7dfeb"/><text x="62" y="468" class="label">桌面环境</text><text x="65" y="507" class="small">温度</text><text x="65" y="553" class="value">24.6 ℃</text><text x="334" y="507" class="small">湿度</text><text x="334" y="553" class="value">48%</text><path d="M65 576H550" stroke="#d7dfeb" fill="none"/><text x="65" y="603" class="label">传感器正常</text><text x="65" y="634" class="small">最后有效采样：5 秒前 · 失败时旧值需标注</text><text x="620" y="422" class="h">04 快捷控制 · 后续阶段</text><rect x="620" y="438" width="540" height="222" rx="18" fill="#ffffff" stroke="#d7dfeb"/><text x="642" y="468" class="label">我的快捷页</text><rect x="640" y="486" width="155" height="115" rx="12" fill="#eaf4fa"/><text x="662" y="532" class="label">打开工作应用</text><text x="662" y="568" class="small">需要客户端支持</text><rect x="812" y="486" width="155" height="115" rx="12" fill="#eaf4fa"/><text x="835" y="532" class="label">麦克风静音</text><text x="835" y="568" class="small">需授权与反馈</text><rect x="985" y="486" width="155" height="115" rx="12" fill="#eaf4fa"/><text x="1005" y="532" class="label">下一页面</text><text x="1005" y="568" class="small">明确导航</text><text x="642" y="636" class="small">已按下 ≠ 已成功 · 断线重连不重放动作</text><text x="40" y="704" class="h">05 客户端编辑 · 配置、预览、校验、同步闭环</text><rect x="40" y="720" width="1120" height="212" rx="16" fill="#ffffff" stroke="#d7dfeb"/><path d="M40 761H1160M244 762V902M896 762V902" stroke="#d7dfeb" fill="none"/><text x="61" y="747" class="label">我的设备档案</text><text x="411" y="747" class="small">演示预览 / 实时预览 / 异常预览</text><text x="923" y="747" class="label">保存草稿　同步</text><text x="62" y="790" class="label">页面与组件</text><text x="62" y="819" class="small">AI · 电脑 · 环境</text><text x="62" y="849" class="small">添加 / 排序 / 复制</text><text x="62" y="879" class="small">数值卡 · 状态 · 导航</text><rect x="338" y="778" width="462" height="108" rx="10" fill="#f2f5f9" stroke="#d7dfeb"/><text x="491" y="813" class="label">目标设备比例预览</text><text x="405" y="845" class="small">组件布局、主题、长文本与异常状态</text><text x="916" y="790" class="label">属性</text><text x="916" y="819" class="small">布局 / 主题 / 数据绑定</text><text x="916" y="849" class="small">动作 / 权限 / 显示规则</text><text x="916" y="879" class="small">资源与可读性校验</text><text x="62" y="920" class="small">草稿 → 校验 → 同步 → 接收 → 应用回执 → 显示生效版本；失败保留上一有效配置</text><text x="40" y="966" class="sub">默认分主题页；概览和快捷页可选。屏幕方向、字号和触控尺寸须在目标硬件上验证。</text></svg>